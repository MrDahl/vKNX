name: Windows build and release
# Push a tag like v0.2.0 to publish a release (installer + zip, notes from CHANGELOG.md).
# "Run workflow" (workflow_dispatch): with a version it also publishes the release (tag vX.Y.Z is created); without, only an artifact.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v (e.g. 0.2.1). Empty = test build only, nothing is published.'
        required: false
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $ver = $env:GITHUB_REF_NAME.TrimStart('v') } elseif ('${{ inputs.version }}' -ne '') { $ver = '${{ inputs.version }}' } else { $ver = '0.0.0-dev' }
          $pub = ($env:GITHUB_REF_TYPE -eq 'tag') -or ('${{ inputs.version }}' -ne '')
          "PUBLISH=$pub" | Add-Content $env:GITHUB_ENV
          $num = $ver -replace '[-+].*',''
          "VERSION=$ver" | Add-Content $env:GITHUB_ENV
          "NUMVER=$num" | Add-Content $env:GITHUB_ENV
          Set-Content core/resources/version.txt "v$ver" -NoNewline
          Write-Host "version v$ver (numeric $num)"

      - name: Build (javac, pinned Calimero + local patches)
        shell: pwsh
        run: tools/build.ps1

      - name: Self-test (backend only, NOT an ETS test)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $ErrorActionPreference = 'Continue'
          cmd /c "powershell -File tools/selftest.ps1 > dist\selftest.log 2>&1"
          "exit=$LASTEXITCODE" | Add-Content dist/selftest.log

      - name: Package modules as jars
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/mods | Out-Null
          foreach ($m in 'core','device','server','vknx') {
            jar --create --file "dist/mods/$m.jar" -C "build/$m" .
          }

      - name: jpackage server (no console window, bundled Java runtime)
        shell: pwsh
        run: |
          jpackage --type app-image --name vKNX-Server --dest dist/jp `
            --module-path dist/mods --module org.vknx/org.vknx.Main `
            --add-modules io.calimero.core,io.calimero.device,io.calimero.server,org.vknx,jdk.httpserver,java.logging,java.xml,java.sql,java.desktop,java.net.http `
            --app-version $env:NUMVER
          New-Item -ItemType Directory -Force dist/app/server | Out-Null
          Copy-Item dist/jp/vKNX-Server/* dist/app/server -Recurse

      - name: Build launcher (WinForms + WebView2, .NET Framework 4.8)
        shell: pwsh
        run: |
          dotnet build launcher/vKNX.csproj -c Release -p:Version=$env:NUMVER -o dist/launcher
          if ($LASTEXITCODE) { throw 'launcher build failed' }
          Get-ChildItem dist/launcher | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          Copy-Item dist/launcher/* dist/app -Recurse -Exclude *.pdb

      - name: Assemble app folder
        shell: pwsh
        run: |
          Copy-Item products dist/app/products -Recurse
          Copy-Item tools/make-knxprod.ps1 dist/app/
          Copy-Item docs dist/app/docs -Recurse
          foreach ($f in 'README.md','CHANGELOG.md','LICENSE','THIRD-PARTY-NOTICES.md') { Copy-Item $f dist/app/ }
          Get-ChildItem dist/app | Select-Object Name | Format-Table | Out-String | Write-Host

      - name: Smoke test 1 - server starts, answers and shuts down (portable)
        shell: pwsh
        continue-on-error: true
        run: |
          $log = 'dist/smoke.log'
          $d = Join-Path $env:RUNNER_TEMP 'vknx-smoke1'
          $p = Start-Process dist/app/server/vKNX-Server.exe -ArgumentList "--no-browser --supervised --console-log --dir `"$d`" --web 18099" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest http://127.0.0.1:18099/api/state -UseBasicParsing -TimeoutSec 2; $ok = $true; break } catch {}
          }
          "smoke1 server answers: $ok" | Add-Content $log
          if ($ok) { ($r.Content.Substring(0, [Math]::Min(160, $r.Content.Length))) | Add-Content $log }
          try { Invoke-WebRequest http://127.0.0.1:18099/api/shutdown -Method Post -UseBasicParsing -TimeoutSec 5 | Out-Null } catch {}
          $exited = $p.WaitForExit(15000)
          "smoke1 server exited after shutdown: $exited (exit code $($p.ExitCode))" | Add-Content $log
          Get-Content (Join-Path $d 'console.log') -ErrorAction SilentlyContinue | Select-Object -First 30 | Add-Content $log
          if (-not $ok) { throw 'server did not answer' }

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist\app" installer\vKNX.iss
          if ($LASTEXITCODE) { throw 'iscc failed' }
          Get-ChildItem dist/*.exe | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: Smoke test 2 - silent install, launcher window + server, close, uninstall
        shell: pwsh
        continue-on-error: true
        run: |
          $log = 'dist/smoke.log'
          $inst = Join-Path $env:RUNNER_TEMP 'vknx-inst'
          $env:VKNX_PORT = '18098'
          $env:VKNX_DATA_DIR = Join-Path $env:RUNNER_TEMP 'vknx-smoke2'
          $setup = (Get-ChildItem dist/vKNX-Setup-*.exe | Select-Object -First 1).FullName
          $p = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$inst`"" -PassThru
          "smoke2 installer exited: $($p.WaitForExit(180000)) code $($p.ExitCode)" | Add-Content $log
          "smoke2 launcher present: $(Test-Path "$inst\vKNX.exe")  server present: $(Test-Path "$inst\server\vKNX-Server.exe")  webview loader: $(Test-Path "$inst\runtimes")" | Add-Content $log
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest http://127.0.0.1:18098/api/state -UseBasicParsing -TimeoutSec 2; $ok = $true; break } catch {}
          }
          "smoke2 launcher started the server (silent install runs the app): $ok" | Add-Content $log
          $lp = Get-Process vKNX -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($lp) { "smoke2 launcher process: window title '$($lp.MainWindowTitle)'" | Add-Content $log; $lp.CloseMainWindow() | Out-Null; "smoke2 launcher closed: $($lp.WaitForExit(20000))" | Add-Content $log }
          else { 'smoke2 launcher process not found' | Add-Content $log }
          Start-Sleep -Seconds 3
          "smoke2 server still running after close: $([bool](Get-Process vKNX-Server -ErrorAction SilentlyContinue))" | Add-Content $log
          Get-Content (Join-Path $env:VKNX_DATA_DIR 'console.log') -ErrorAction SilentlyContinue | Select-Object -First 20 | Add-Content $log
          $un = Get-ChildItem $inst -Filter 'unins*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($un) { Start-Process $un.FullName -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES' -Wait; "smoke2 uninstalled, folder gone: $(-not (Test-Path "$inst\vKNX.exe"))" | Add-Content $log }
          if (-not $ok) { throw 'launcher did not start the server' }

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/zip/vKNX | Out-Null
          Copy-Item dist/app/* dist/zip/vKNX -Recurse
          Compress-Archive -Path dist/zip/vKNX -DestinationPath "dist/vKNX-$env:VERSION-windows.zip"

      - name: Publish logs to ci-logs branch
        if: always()
        shell: pwsh
        run: |
          git config user.name ci; git config user.email ci@example.invalid
          git checkout --orphan ci-logs; git rm -rf -q . 2>$null
          Copy-Item dist/selftest.log selftest.log -ErrorAction SilentlyContinue
          Copy-Item dist/smoke.log smoke.log -ErrorAction SilentlyContinue
          git add -A; git commit -q -m "ci logs"; git push -f origin ci-logs

      - name: Release notes from CHANGELOG.md
        if: env.PUBLISH == 'True'
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $head = '## [' + $env:VERSION + ']'
          $out = @(); $in = $false
          foreach ($l in $lines) {
            if ($l.StartsWith($head)) { $in = $true; continue }
            if ($in -and $l.StartsWith('## [')) { break }
            if ($in) { $out += $l }
          }
          if ($out.Count -eq 0) { $out = @("vKNX $env:VERSION") }
          ($out -join "`n").Trim() | Set-Content dist/notes.md -Encoding UTF8
          Get-Content dist/notes.md | Write-Host

      - name: Publish release
        if: env.PUBLISH == 'True'
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null   # old rolling pre-release, replaced by versioned releases
          gh release create "v$env:VERSION" "dist/vKNX-Setup-$env:VERSION.exe" "dist/vKNX-$env:VERSION-windows.zip" --target $env:GITHUB_SHA --title "vKNX $env:VERSION" --notes-file dist/notes.md --latest

      - uses: actions/upload-artifact@v4
        with:
          name: vKNX-windows
          path: |
            dist/vKNX-Setup-*.exe
            dist/vKNX-*-windows.zip
