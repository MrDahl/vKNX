name: Windows exe
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Build (javac, pinned Calimero)
        shell: pwsh
        run: tools/build.ps1
      - name: Self-test (backend only, NOT an ETS test)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $ErrorActionPreference = 'Continue'
          cmd /c "powershell -File tools/selftest.ps1 > dist\selftest.log 2>&1"
          "exit=$LASTEXITCODE" | Add-Content dist/selftest.log
          ipconfig | Add-Content dist/selftest.log
      - name: Package modules as jars
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/mods | Out-Null
          foreach ($m in 'core','device','server','vknx') {
            jar --create --file "dist/mods/$m.jar" -C "build/$m" .
          }
      - name: jpackage (app image with bundled Java runtime)
        shell: pwsh
        run: |
          jpackage --type app-image --name vKNX --dest dist/out `
            --module-path dist/mods --module org.vknx/org.vknx.Main `
            --add-modules io.calimero.core,io.calimero.device,io.calimero.server,org.vknx,jdk.httpserver,java.logging,java.xml,java.sql,java.desktop `
            --win-console --app-version 0.1.0
          Copy-Item products dist/out/vKNX/products -Recurse
          Copy-Item tools/make-knxprod.ps1 dist/out/vKNX/
          Copy-Item docs dist/out/vKNX/docs -Recurse
          Compress-Archive -Path dist/out/vKNX -DestinationPath dist/vKNX-windows.zip
      - name: Publish logs to ci-logs branch
        if: always()
        shell: pwsh
        run: |
          git config user.name ci; git config user.email ci@example.invalid
          git checkout --orphan ci-logs; git rm -rf -q . 2>$null
          Copy-Item dist/selftest.log selftest.log -ErrorAction SilentlyContinue
          git add selftest.log; git commit -q -m "ci logs"; git push -f origin ci-logs
      - name: Publish rolling pre-release (download link without Actions login)
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest dist/vKNX-windows.zip --prerelease --title "vKNX (seneste bygning, prototype - ikke ETS-testet)" --notes "Pakkes af GitHub Actions. Udpak zip-filen og start vKNX\vKNX.exe. Backend-selvtest er kørt; kompatibilitet med ETS er IKKE testet."
      - uses: actions/upload-artifact@v4
        with: { name: vKNX-windows, path: dist/vKNX-windows.zip }
