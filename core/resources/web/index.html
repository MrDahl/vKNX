<!doctype html>
<html lang="da" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vKNX</title>
<script>
// set the theme before first paint (no flash)
try{var th=localStorage.getItem('vknx-theme')||('dark');document.documentElement.dataset.theme=th}catch(e){}
</script>
<style>
:root{
  --bg:#0b1220;--bg2:#0f192b;--panel:#131f35;--panel2:#18273f;--line:#233350;--ink:#e8eef9;--mute:#8d9fbd;
  --accent:#38a1ff;--accent-ink:#04121f;--on:#ffc53d;--green:#35d07f;--orange:#ff9f43;--red:#ff5d5d;--cyan:#4fd8e6;
  --c-lamp:#ffc53d;--c-btn:#38a1ff;--c-blind:#7db4f0;--c-temp:#ff7a59;--c-hum:#3aa0ff;--c-co2:#2ec4b6;--c-lux:#ffd23d;--c-press:#a98bff;--c-wind:#4fd8e6;--c-rand:#ff77c8;--c-sun:#ffc53d;--c-moon:#9db4ff;--c-danger:#ff6b6b;--c-ok:#35d07f;--shadow:0 6px 24px rgba(0,0,0,.35);--glass:rgba(255,255,255,.04);--mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
:root[data-theme=light]{
  --bg:#eaeff6;--bg2:#f4f7fb;--panel:#ffffff;--panel2:#f3f6fb;--line:#d9e1ee;--ink:#14213a;--mute:#5d6e8c;
  --accent:#0a67d1;--accent-ink:#fff;--on:#f0a800;--green:#13a05a;--orange:#d9690b;--red:#d03535;--cyan:#0f8fa0;
  --c-lamp:#e8a000;--c-btn:#0a67d1;--c-blind:#3d7cc9;--c-temp:#e0502a;--c-hum:#0a67d1;--c-co2:#0f9d8f;--c-lux:#d9a300;--c-press:#7a56d6;--c-wind:#0f8fa0;--c-rand:#d6329c;--c-sun:#e8a000;--c-moon:#4a5fc1;--c-danger:#d03535;--c-ok:#13a05a;--shadow:0 4px 18px rgba(20,33,58,.10);--glass:rgba(10,103,209,.05);
}
*{box-sizing:border-box} [hidden]{display:none!important}
html{font-size:clamp(12px,.2vw + 10px,17px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,Roboto,sans-serif;line-height:1.4;min-height:100vh}
button,select,input{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--panel2);border-radius:.55rem;padding:.45rem .85rem;cursor:pointer;transition:.12s}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
input[type=text],select{background:var(--bg2);border:1px solid var(--line);border-radius:.55rem;padding:.4rem .65rem}
input[type=range]{width:100%;accent-color:var(--accent)}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:1rem;padding:.7rem 1.3rem;background:linear-gradient(180deg,var(--panel),var(--bg2));border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:.65rem}
.logo svg{width:2.3rem;height:2.3rem}
.logo b{font-size:1.45rem;letter-spacing:.02em} .logo b i{font-style:normal;color:var(--accent)}
.logo small{display:block;color:var(--mute);font-size:.78rem;margin-top:-.15rem}
.status{display:flex;gap:.6rem;align-items:center;flex:1;flex-wrap:wrap;margin-left:1.2rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.2rem .7rem;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:.82rem;color:var(--mute)}
.chip b{color:var(--ink);font-weight:600}
.dot{width:.62rem;height:.62rem;border-radius:50%;background:var(--mute);display:inline-block;flex:none}
.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)} .dot.prog{background:var(--red);box-shadow:0 0 8px var(--red)} .dot.warn{background:var(--orange)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(17rem,21rem) minmax(0,1fr) minmax(16rem,20rem);gap:1rem;padding:1rem 1.3rem 0;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:.9rem;box-shadow:var(--shadow);overflow:hidden}
.panel>h3{margin:0;padding:.7rem 1rem;font-size:.82rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));display:flex;align-items:center;gap:.5rem}
.panel>h3 .n{margin-left:auto;background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:0 .55rem;font-size:.75rem;color:var(--ink)}
.col{display:grid;gap:1rem}
.empty{padding:1rem;color:var(--mute);font-size:.9rem}

/* topology */
.line-h{padding:.45rem 1rem;font-size:.78rem;color:var(--mute);background:var(--glass);border-bottom:1px solid var(--line);letter-spacing:.06em}
.dev-i{display:grid;grid-template-columns:auto 1fr;gap:.1rem .65rem;padding:.55rem 1rem;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.dev-i:hover{background:var(--glass)} .dev-i:last-child{border-bottom:0}
.dev-i .a{font:600 .92rem var(--mono);color:var(--green)} .dev-i .a.un{color:var(--mute)}
.dev-i .nm{font-weight:600} .dev-i .sm{grid-column:2;color:var(--mute);font-size:.8rem}
.dev-i .dot{grid-row:1/3}

/* add */
.addbox{padding:.9rem 1rem;display:grid;gap:.5rem}
.addbox .r{display:flex;gap:.5rem} .addbox .r>*{min-width:0} .addbox input{flex:1;width:100%} .addbox{min-width:0} .addbox select{width:100%}
.err{color:var(--red);font-size:.85rem;min-height:1.1em}

/* group addresses */
.ga{padding:.6rem 1rem;border-bottom:1px solid var(--line)} .ga:last-child{border-bottom:0}
.ga .g{font:700 1rem var(--mono);color:var(--orange)}
.ga ul{list-style:none;margin:.25rem 0 0;padding:0;font-size:.82rem;color:var(--mute)}
.ga li{display:flex;gap:.4rem;align-items:baseline} .ga li b{color:var(--ink);font-weight:600}
.fl{font:600 .68rem var(--mono);letter-spacing:.05em;color:var(--cyan);margin-left:auto}

/* devices */
.grid{columns:19rem auto;column-gap:1rem}
.card{break-inside:avoid;margin-bottom:1rem;background:var(--panel);border:1px solid var(--line);border-radius:.9rem;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:border-color .2s,box-shadow .2s}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.card.prog{border-color:var(--red)}
.card .hd{display:flex;gap:.7rem;align-items:flex-start;padding:.85rem 1rem .6rem}
.card .hd .t{flex:1;min-width:0} .card h2{margin:0;font-size:1.1rem;line-height:1.2} .card .prod{color:var(--mute);font-size:.8rem}
.addrchip{font:700 .95rem var(--mono);padding:.15rem .6rem;border-radius:.45rem;background:var(--glass);border:1px solid var(--line);color:var(--green);white-space:nowrap}
.addrchip.un{color:var(--mute)}
.card .bd{padding:.3rem 1rem .8rem;display:grid;gap:.7rem}
.card .ft{display:flex;gap:.5rem;align-items:center;padding:.6rem 1rem;border-top:1px solid var(--line);background:var(--glass);border-radius:0 0 .9rem .9rem;flex-wrap:wrap}
.pill{font-size:.74rem;padding:.1rem .6rem;border-radius:99px;background:var(--glass);border:1px solid var(--line);color:var(--mute)}
.pill.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.ft .grow{flex:1}
.progbtn{display:inline-flex;align-items:center;gap:.5rem}
.led{width:.8rem;height:.8rem;border-radius:50%;background:var(--line);display:inline-block}
.led.on{background:var(--red);box-shadow:0 0 10px var(--red)}
.xbtn{border:0;background:transparent;color:var(--mute);padding:.1rem .45rem;font-size:1.1rem;line-height:1} .xbtn:hover{color:var(--red)}
details.params{font-size:.82rem;color:var(--mute)} details.params summary{cursor:pointer;user-select:none}
details.params dl{margin:.4rem 0 0;display:grid;grid-template-columns:1fr auto;gap:.15rem .8rem} details.params dd{margin:0;color:var(--ink);font-weight:600;text-align:right}

.bigbtn{width:100%;padding:1rem;font-size:1.1rem;border-radius:.8rem}
.keys{display:grid;gap:.6rem}
.key{padding:1.1rem .5rem;font-size:1rem;border-radius:.8rem;user-select:none;touch-action:none;background:var(--panel2)}
.key:active,.key.down{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lamp{width:3.6rem;height:3.6rem;border-radius:50%;background:var(--bg2);border:2px solid var(--line);display:grid;place-items:center;font-size:1.6rem;transition:.18s;flex:none}
.lamp.on{background:color-mix(in srgb,var(--on) 25%,var(--panel));border-color:var(--on);box-shadow:0 0 26px 4px color-mix(in srgb,var(--on) 55%,transparent)}
.lamps{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem} .lampbox{text-align:center;font-size:.75rem;color:var(--mute)} .lampbox .lamp{width:2.8rem;height:2.8rem;font-size:1.2rem;margin:0 auto .15rem}
.row{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.meter{height:.7rem;background:var(--bg2);border:1px solid var(--line);border-radius:6px;overflow:hidden;width:100%;margin-top:.3rem} .meter>i{display:block;height:100%;background:linear-gradient(90deg,#c98a00,var(--on));transition:width .08s}
.blinds{display:grid;grid-template-columns:1fr 1fr;gap:.8rem} .blind{text-align:center;font-size:.8rem;color:var(--mute)}
.win{height:5.5rem;border:2px solid var(--line);border-radius:.5rem;background:linear-gradient(180deg,#5aa9e6,#bfe3ff);position:relative;overflow:hidden;margin:.3rem 0}
.win>i{position:absolute;left:0;right:0;top:0;background:repeating-linear-gradient(#a8936a 0 6px,#8d7a54 6px 8px);transition:height .12s;border-bottom:2px solid #6e5e3e}
.sens{display:grid;grid-template-columns:1fr auto;gap:.05rem .7rem;font-size:.85rem} .sens label{color:var(--mute)} .sens b{font-family:var(--mono)}
.hint{color:var(--mute);font-size:.78rem}

/* monitor */
.monwrap{padding:1rem 1.3rem 1.3rem}
.mon .bar{display:flex;gap:.8rem;align-items:center;padding:.6rem 1rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mon .bar input[type=text]{flex:1;min-width:12rem}
.mon .bar label{display:inline-flex;gap:.35rem;align-items:center;font-size:.85rem;color:var(--mute)}
#log{height:22rem;overflow:auto;font:.82rem/1.55 var(--mono);padding:.3rem 0;background:var(--bg2)}
.ln{padding:.05rem 1rem;white-space:pre-wrap;border-left:3px solid transparent;display:flex;gap:.7rem}
.ln .t{color:var(--mute);flex:none} .ln .tag{flex:none;width:11rem;font-weight:700;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);overflow:hidden;text-overflow:ellipsis;padding-top:.12rem}
.ln.bus{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)} .ln.bus .tag{color:var(--accent)}
.ln.exp .x{color:var(--mute)}
.ia{color:var(--green)} .gad{color:var(--orange)} .svc{color:var(--cyan)}
.note{color:var(--mute);font-size:.8rem;padding:.6rem 1rem;border-top:1px solid var(--line)}

/* MDI icons (Pictogrammers, Apache-2.0) – colours are fixed by role, not user-selectable */
svg.ic{width:1.15em;height:1.15em;fill:currentColor;vertical-align:-.2em;flex:none}
.ic-lamp{color:var(--mute)} .lamp.on .ic-lamp{color:var(--c-lamp);filter:drop-shadow(0 0 5px var(--c-lamp))}
.ic-button,.ic-key,.ic-slider,.ic-up,.ic-down{color:var(--c-btn)} .ic-blind{color:var(--c-blind)}
.ic-temp{color:var(--c-temp)} .ic-hum{color:var(--c-hum)} .ic-co2{color:var(--c-co2)} .ic-lux{color:var(--c-lux)} .ic-press{color:var(--c-press)} .ic-wind{color:var(--c-wind)} .ic-dice{color:var(--c-rand)}
.ic-sun{color:var(--c-sun)} .ic-moon{color:var(--c-moon)} .ic-close,.ic-trash{color:var(--c-danger)} .ic-plus,.ic-check,.ic-upload,.ic-edit{color:var(--c-ok)} .ic-devices,.ic-plan,.ic-translate{color:var(--c-btn)}
.mkbtn svg.ic,.key.down svg.ic,button.primary svg.ic,.tabs button.act svg.ic{color:inherit} .mkbtn svg.ic{width:1.3em;height:1.3em}
.lamp svg.ic{width:1.45em;height:1.45em} .mk .lamp svg.ic{color:#7c8799} .mk .dimlamp.lit .base svg.ic{color:var(--c-lamp)!important} .mk .lamp.on svg.ic{color:var(--c-lamp)}
button svg.ic,label.btn svg.ic{margin-right:.35rem} .xbtn svg.ic,.mkx svg.ic{margin:0}
.sens label svg.ic{margin-right:.35rem} .mkx svg.ic{color:#fff!important;width:.9em;height:.9em;margin:0} .mkpill svg.ic{width:1em;height:1em;margin-right:.3rem}
/* dimmable lamp: the outline stays, the filled bulb fades in with the brightness */
.dimlamp{display:grid;place-items:center} .dimlamp>*{grid-area:1/1;display:grid;place-items:center}
.dimlamp .base svg.ic{color:var(--mute)} .dimlamp.lit .base svg.ic{color:var(--c-lamp)!important;filter:none}
.dimlamp .fill svg.ic{color:var(--c-lamp)!important;filter:drop-shadow(0 0 5px var(--c-lamp))}
.lamp.dim{transition:box-shadow .1s}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:1rem;padding:0;box-shadow:var(--shadow);width:min(36rem,92vw)} dialog::backdrop{background:rgba(5,10,20,.6)}
.dlgbody{padding:1.1rem 1.3rem;display:grid;gap:1rem} .dlgbody h4{margin:0 0 .3rem;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.dlgbody .sec{border:1px solid var(--line);border-radius:.8rem;padding:.8rem 1rem;background:var(--bg2);display:grid;gap:.5rem} .dlgbody .r{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.notes{white-space:pre-wrap;font-size:.82rem;max-height:12rem;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.6rem .8rem}
.progress{height:.6rem;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden} .progress i{display:block;height:100%;background:var(--accent)}
.ok{color:var(--c-ok)} .bad{color:var(--c-danger)} a.lnk{color:var(--accent)}
/* tabs + floor plan */
.tabs{display:flex;gap:.3rem;background:var(--glass);border:1px solid var(--line);border-radius:.7rem;padding:.2rem}
.tabs button{border:0;background:transparent;padding:.35rem .9rem} .tabs button.act{background:var(--accent);color:var(--accent-ink);font-weight:600}
.planview{padding:1rem 1.3rem 0}
.plan-bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.8rem}
.plan-bar label.btn{border:1px solid var(--line);background:var(--panel2);border-radius:.55rem;padding:.45rem .85rem;cursor:pointer}
.plan-bar label.btn:hover{border-color:var(--accent)} .plan-bar button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.plan-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(14rem,18rem);gap:1rem;align-items:start}
.plan-scroll{overflow:auto;max-height:78vh;border-radius:.9rem;border:1px solid var(--line);background:var(--bg2)} .plan-scroll .plan-canvas{border:0;border-radius:0;box-shadow:none;margin:0}
.zoom{display:inline-flex;align-items:center;gap:.3rem} .zoom input{width:8rem} .zoom b{font:600 .8rem var(--mono);min-width:3.2rem;text-align:right} .zoom button{padding:.3rem .5rem}
.plan-canvas{position:relative;background:#fff;border:1px solid var(--line);border-radius:.9rem;box-shadow:var(--shadow);overflow:hidden;min-height:18rem;user-select:none;touch-action:none}
.plan-canvas.empty{aspect-ratio:16/9;background:repeating-linear-gradient(0deg,transparent 0 31px,var(--line) 31px 32px),repeating-linear-gradient(90deg,transparent 0 31px,var(--line) 31px 32px),var(--bg2)}
.plan-canvas img{display:block;width:100%;height:auto}
.plan-canvas .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);text-align:center;padding:2rem}
#planLayer{position:absolute;inset:0}
.mk{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.15rem;z-index:2}
.edit .mk{cursor:grab;outline:2px dashed var(--accent);outline-offset:3px;border-radius:.6rem;background:color-mix(in srgb,var(--accent) 10%,transparent)} .edit .mk *{pointer-events:none}
.edit .mk .mkx{pointer-events:auto}
.mk .mklabel{font-size:.7rem;font-weight:600;color:#14213a;background:rgba(255,255,255,.88);border:1px solid rgba(20,33,58,.2);border-radius:.4rem;padding:0 .35rem;white-space:nowrap;max-width:9rem;overflow:hidden;text-overflow:ellipsis}
.mk .lamp{width:2.4rem;height:2.4rem;font-size:1.1rem;background:rgba(255,255,255,.92)}
.mk .mkbtn{width:2.3rem;height:2.3rem;border-radius:50%;padding:0;font-size:.9rem;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.mk .mkbtn.down,.mk .mkbtn:active{transform:scale(.92);background:var(--green)}
.mk .mkwin{width:2.4rem;height:2.8rem;border:2px solid #4a5877;border-radius:.3rem;background:linear-gradient(180deg,#5aa9e6,#bfe3ff);position:relative;overflow:hidden}
.mk .mkwin i{position:absolute;left:0;right:0;top:0;background:repeating-linear-gradient(#a8936a 0 4px,#8d7a54 4px 6px);border-bottom:2px solid #6e5e3e}
.mk .mkpill{font:700 .78rem var(--mono);background:#14213a;color:#fff;border-radius:99px;padding:.15rem .6rem;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.mk input[type=range]{width:6rem}
.mk .pct{font:700 .7rem var(--mono);background:rgba(255,255,255,.9);color:#14213a;border-radius:.3rem;padding:0 .3rem}
.mkx{position:absolute;top:-.8rem;right:-.8rem;width:1.3rem;height:1.3rem;border-radius:50%;padding:0;line-height:1;font-size:.8rem;background:var(--red);color:#fff;border-color:var(--red);display:none}
.edit .mkx{display:block}
.pal{padding:.4rem 0;max-height:70vh;overflow:auto}
.pal .gh{padding:.3rem 1rem;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.pal .pi{display:flex;align-items:center;gap:.5rem;padding:.4rem 1rem;cursor:grab;border-bottom:1px solid var(--line);font-size:.88rem} .pi:hover{background:var(--glass)}
.pal .pi .ic{width:1.6rem;text-align:center}
@media (max-width:1000px){.plan-body{grid-template-columns:1fr}}
@media (max-width:1200px){.layout{grid-template-columns:minmax(15rem,19rem) minmax(0,1fr)} .layout>.col:last-child{grid-column:1/-1}}
@media (max-width:800px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="2" y="2" width="44" height="44" rx="11" fill="var(--accent)"/><path d="M13 14l11 20 11-20" fill="none" stroke="var(--accent-ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><b>v<i>KNX</i></b><small id="tag"></small></div>
  </div>
  <nav class="tabs"><button id="tabDev" class="act" onclick="setView('dev')"></button><button id="tabPlan" onclick="setView('plan')"></button></nav>
  <div class="status" id="status"></div>
  <button class="ghost" id="btnSettings" onclick="openSettings()"></button>
  <button class="ghost" id="theme" onclick="toggleTheme()" title="Lyst/mørkt"></button>
  <button id="lang" onclick="toggleLang()">English</button>
</header>

<div class="layout">
  <div class="col">
    <section class="panel"><h3><span id="hTopo"></span><span class="n" id="nDev">0</span></h3><div id="topo"></div></section>
    <section class="panel"><h3 id="hAdd"></h3>
      <div class="addbox">
        <select id="addProd"></select>
        <div class="r"><input type="text" id="addName" maxlength="20"><button class="primary" id="btnAdd" onclick="addDevice()"></button></div>
        <div class="err" id="addErr"></div>
      </div>
    </section>
  </div>
  <section class="grid" id="devices"></section>
  <div class="col">
    <section class="panel"><h3><span id="hGa"></span><span class="n" id="nGa">0</span></h3><div id="gas"></div></section>
  </div>
</div>

<section class="planview" id="planView" hidden>
  <div class="plan-bar">
    <label class="btn"><span id="lblLoadPlan"></span><input type="file" id="planFile" accept="image/png,image/jpeg,image/svg+xml,image/webp,image/gif" hidden></label>
    <button id="btnEdit" onclick="toggleEdit()"></button>
    <button class="ghost" id="btnPlanRm" onclick="removePlan()"></button>
    <span class="zoom"><button class="ghost" onclick="setZoom(zoom-10)" id="zOut"></button><input type="range" id="zoomR" min="30" max="300" step="5" value="100" oninput="setZoom(+this.value)"><button class="ghost" onclick="setZoom(zoom+10)" id="zIn"></button><b id="zVal">100 %</b><button class="ghost" onclick="setZoom(100)" id="zFit"></button></span>
    <span class="hint" id="planHint"></span>
  </div>
  <div class="plan-body">
    <div class="plan-scroll" id="planScroll"><div class="plan-canvas empty" id="planCanvas"><img id="planImg" alt="" hidden><div class="ph" id="planPh"></div><div id="planLayer"></div></div></div>
    <aside class="panel"><h3 id="hPal"></h3><div class="pal" id="palList"></div></aside>

  const prod=lang==='da'?d.productDa:d.productEn,en=esc(d.name).replace(/'/g,"\\'");
  let h=`<div class="hd"><span class="dot ${d.programming?'prog':d.loaded?'ok':''}" style="margin-top:.5rem"></span><div class="t"><h2>${esc(d.name)}</h2><div class="prod">${esc(prod)}</div></div>
   <span class="addrchip ${d.unassigned?'un':''}">${d.unassigned?'15.15.255':esc(d.address)}</span><button class="xbtn rm" title="${t('remove')}" onclick="rmDev('${encodeURIComponent(d.name)}')">${ic('close')}</button></div><div class="bd">`;
  h+=body(d);
  if(d.loaded&&d.params.length){const op=openParams.has(d.name)?' open':'';h+=`<details class="params"${op} ontoggle="toggleParams('${en}',this.open)"><summary>${t('params')}</summary><dl>`+d.params.map(p=>`<dt>${esc(lang==='da'?p.da:p.en)}</dt><dd>${esc(lang==='da'?p.valueDa:p.valueEn)}</dd>`).join('')+`</dl></details>`}
  h+=`</div><div class="ft"><button class="progbtn" onclick="post('/api/prog?dev=${encodeURIComponent(d.name)}')"><span class="led ${d.programming?'on':''}"></span>${t('prog')}</button><span class="grow"></span><span class="pill ${d.loaded?'ok':''}">${d.loaded?t('loaded'):t('notloaded')}</span><span class="pill">${t('dl')}: ${d.downloads}</span></div>`;
  c.innerHTML=h;el.appendChild(c)}
 if(view==='plan')renderPlan(ds);
}
function toggleParams(n,o){o?openParams.add(n):openParams.delete(n)}

const SENS=[['CO2','ppm',400,5000,10],['Humidity','%',0,100,0.5],['Illuminance','lux',0,100000,50],['Temperature','°C',-30,60,0.5],['Pressure','Pa',30000,110000,50],['WindSpeed','m/s',0,50,0.5]];
function dv(n){return encodeURIComponent(n)}
function act(n,a,v){fetch(`/api/act?dev=${dv(n)}&a=${a}&v=${v}`,{method:'POST'})}
function key(n,k,down){act(n,down?'down':'up',k)}
function dimLamp(pct,on){const lv=Math.max(0,Math.min(100,pct||0))/100;const g=lv>0?`box-shadow:0 0 ${(26*lv).toFixed(1)}px ${(4*lv).toFixed(1)}px color-mix(in srgb,var(--c-lamp) ${Math.round(55*lv)}%,transparent);border-color:color-mix(in srgb,var(--c-lamp) ${Math.round(100*lv)}%,var(--line));`:'';
 return `<div class="lamp dim" style="${g}"><span class="dimlamp ${lv>0?'lit':''}"><span class="base">${ic('lampOff','lamp')}</span><span class="fill" style="opacity:${lv}">${ic('lamp','lamp')}</span></span></div>`}
function lampBox(on,label){return `<div class="lampbox"><div class="lamp ${on?'on':''}">${ic(on?'lamp':'lampOff','lamp')}</div>${label||''}</div>`}
function keyBtn(e,k,label){return `<button class="key" onpointerdown="this.setPointerCapture(event.pointerId);this.classList.add('down');key('${e}',${k},true)" onpointerup="this.classList.remove('down');key('${e}',${k},false)" onpointercancel="this.classList.remove('down');key('${e}',${k},false)">${label}</button>`}
function body(d){const v=d.view||{},n=d.name,e=esc(n).replace(/'/g,"\\'");let h='';
 switch(d.product){
 case 'push-button': h=`<button class="bigbtn primary" onclick="act('${e}','press',0)">${t('press')}</button>`;break;
 case 'push-rocker': h=`<div class="keys">${keyBtn(e,1,ic('up')+t('upper'))}${keyBtn(e,2,ic('down')+t('lower'))}</div><div class="hint">${t('hold')}</div>`;break;
 case 'push-slider': h=`<button class="bigbtn primary" onclick="act('${e}','press',0)">${t('toggle')}</button>
   <div><div class="row">${t('slider')}: <b>${v.level??0} %</b></div><input type="range" min="0" max="100" value="${v.level??0}" oninput="act('${e}','sliderLive',this.value);this.previousElementSibling.querySelector('b').textContent=this.value+' %'" onchange="act('${e}','slider',this.value)"></div>`;break;
 case 'switch-actuator': h=`<div class="row"><div class="lamp ${v.lamp?'on':''}">${ic(v.lamp?'lamp':'lampOff','lamp')}</div><div>${t('relay')}: <b>${d.loaded?(v.relayClosed?t('closed'):t('open')):'–'}</b></div></div>`;break;
 case 'switch-actuator-4': case 'switch-actuator-8': h=`<div class="lamps">${[...(v.lamps||'')].map((c,i)=>lampBox(c==='1',i+1)).join('')}</div>`;break;
 case 'dimmer': h=`<div class="row">${dimLamp(d.loaded?v.level:0)}<div style="flex:1;min-width:8rem">${t('level')}: <b>${d.loaded?v.level+' %':'–'}</b> ${v.ramping?`<span class="pill">${t('ramping')}</span>`:''}<div class="meter"><i style="width:${d.loaded?v.level:0}%"></i></div></div></div>`;break;
 case 'blind-2': h=`<div class="blinds">${[1,2].map(c=>`<div class="blind">${t('blind')} ${c}<div class="win"><i style="height:${d.loaded?v['pos'+c]:0}%"></i></div><b style="color:var(--ink)">${d.loaded?v['pos'+c]:'–'} %</b> ${v['dir'+c]>0?ic('arrowDown','blind'):v['dir'+c]<0?ic('arrowUp','blind'):''}</div>`).join('')}</div>`;break;
 case 'multisensor': h=`<div class="hint">${t('sensorHint')}</div><div class="sens">${SENS.map((s,i)=>`<label>${ic(SENSIC[i])}${s[0]} (${s[1]})</label><b id="sv_${esc(n)}_${i}">${v['s'+i]}</b><input style="grid-column:1/3" type="range" min="${s[2]}" max="${s[3]}" step="${s[4]}" value="${v['s'+i]}" oninput="document.getElementById('sv_${esc(n)}_${i}').textContent=this.value" onchange="act('${e}','s${i}',Math.round(this.value*10))">`).join('')}
   <label>${t('random')}</label><b>${v.random??0}</b><label>${t('cycles')}</label><b>${v.cycles??0}</b></div>`;break;
 default: h='';}
 return h}
/* ================= floor plan ================= */
let zoom=100,view='dev',editMode=false,layout={items:[]},hasPlan=false,dragging=null,saveTimer=null;
function setView(v){view=v;$('tabDev').classList.toggle('act',v==='dev');$('tabPlan').classList.toggle('act',v==='plan');document.querySelector('.layout').hidden=v!=='dev';$('planView').hidden=v!=='plan';_lastSig='';if(v==='plan')loadPlan();poll()}
function planStatic(){$('btnEdit').innerHTML=(editMode?ic('check'):ic('edit'))+(editMode?t('editOn'):t('editOff'));$('btnEdit').classList.toggle('on',editMode);$('planHint').textContent=editMode?t('hintEdit'):t('hintRun');$('planPh').textContent=t('noPlan');$('btnPlanRm').hidden=!hasPlan}
function setZoom(z,save){zoom=Math.max(30,Math.min(300,Math.round(z)));$('planCanvas').style.width=zoom+'%';$('zoomR').value=zoom;$('zVal').textContent=zoom+' %';layout.zoom=zoom;if(save!==false)saveLayout()}
function toggleEdit(){editMode=!editMode;planStatic();_lastSig='';poll()}
function loadPlan(){const img=$('planImg');img.onload=()=>{hasPlan=true;img.hidden=false;$('planCanvas').classList.remove('empty');$('planPh').hidden=true;planStatic()};
 img.onerror=()=>{hasPlan=false;img.hidden=true;$('planCanvas').classList.add('empty');$('planPh').hidden=false;planStatic()};img.src='/api/plan?'+Date.now()}
async function removePlan(){if(!confirm(t('confirmPlanRm')))return;await fetch('/api/plan?remove=1',{method:'POST'});loadPlan()}
$('planFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const ext=(f.name.split('.').pop()||'').toLowerCase();
 const r=await fetch('/api/plan?ext='+encodeURIComponent(ext),{method:'POST',body:await f.arrayBuffer()});if(!r.ok)alert(await r.text());e.target.value='';loadPlan()});
async function loadLayout(){try{layout=await (await fetch('/api/layout')).json();if(!layout.items)layout.items=[]}catch(e){layout={items:[]}};setZoom(layout.zoom||100,false)}
function saveLayout(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>fetch('/api/layout',{method:'POST',body:JSON.stringify(layout)}),300)}
function pointsOf(d){const v=d.view||{},n=d.name,P=[];const add=(k,type,extra)=>P.push(Object.assign({id:n+'|'+k,dev:n,k,type,label:n},extra));
 switch(d.product){
  case 'push-button':add('btn','button');break;
  case 'push-rocker':add('k1','key',{keyNo:1,sym:'up',label:n+' ('+t('upper')+')'});add('k2','key',{keyNo:2,sym:'down',label:n+' ('+t('lower')+')'});break;
  case 'push-slider':add('btn','button');add('sl','slider',{label:n+' ('+t('slider')+')',val:v.level??0});break;
  case 'switch-actuator':add('l1','lamp',{on:!!v.lamp});break;
  case 'switch-actuator-4':case 'switch-actuator-8':[...(v.lamps||'')].forEach((c,i)=>add('l'+(i+1),'lamp',{on:c==='1',label:n+' '+(i+1)}));break;
  case 'dimmer':add('dim','lamp',{on:v.level>0,pct:v.level});break;
  case 'blind-2':[1,2].forEach(c=>add('b'+c,'blind',{pos:v['pos'+c]??0,label:n+' '+c}));break;
  case 'multisensor':SENS.forEach((s,i)=>add('s'+i,'sensor',{text:v['s'+i]+' '+s[1],label:n+' '+s[0]}));break;}
 return P}
function icoOf(p){return p.type==='sensor'?ic(SENSIC[+p.k.slice(1)]):p.type==='key'?ic(p.sym):p.type==='lamp'?ic('lampOff','lamp'):ic(p.type)}
function markerHtml(p,it){const e=esc(p.dev).replace(/'/g,"\\'");let inner='';
 switch(p.type){
  case 'lamp':inner=(p.pct!=null?dimLamp(p.pct):`<div class="lamp ${p.on?'on':''}">${ic(p.on?'lamp':'lampOff','lamp')}</div>`)+(p.pct!=null&&p.on?`<span class="pct">${p.pct} %</span>`:'');break;
  case 'button':inner=`<button class="mkbtn" onclick="act('${e}','press',0)">${ic('button')}</button>`;break;
  case 'key':inner=`<button class="mkbtn key" onpointerdown="this.setPointerCapture(event.pointerId);this.classList.add('down');key('${e}',${p.keyNo},true)" onpointerup="this.classList.remove('down');key('${e}',${p.keyNo},false)" onpointercancel="this.classList.remove('down');key('${e}',${p.keyNo},false)">${ic(p.sym,'key')}</button>`;break;
  case 'slider':inner=`<input type="range" min="0" max="100" value="${p.val}" oninput="act('${e}','sliderLive',this.value)" onchange="act('${e}','slider',this.value)">`;break;
  case 'blind':inner=`<div class="mkwin"><i style="height:${p.pos}%"></i></div><span class="pct">${p.pos} %</span>`;break;
  case 'sensor':inner=`<span class="mkpill"><span class="ico">${ic(SENSIC[+p.k.slice(1)])}</span>${esc(p.text)}</span>`;break;}
 return `<div class="mk" data-id="${esc(p.id)}" style="left:${it.x*100}%;top:${it.y*100}%">${inner}<span class="mklabel">${esc(it.label||p.label)}</span><button class="mkx" onclick="unplace('${esc(p.id).replace(/'/g,"\\'")}')">${ic('close')}</button></div>`}
function renderPlan(ds){const pts={};for(const d of ds)for(const p of pointsOf(d))pts[p.id]=p;
 $('planCanvas').classList.toggle('edit',editMode);
 $('planLayer').innerHTML=layout.items.filter(it=>pts[it.id]).map(it=>markerHtml(pts[it.id],it)).join('');
 const placed=new Set(layout.items.map(i=>i.id));let h='';
 for(const d of ds){const free=pointsOf(d).filter(p=>!placed.has(p.id));if(!free.length)continue;
  h+=`<div class="gh">${esc(d.name)}</div>`+free.map(p=>`<div class="pi" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${esc(p.id).replace(/'/g,"\\'")}')" onclick="placeAt('${esc(p.id).replace(/'/g,"\\'")}',.5,.5)"><span class="ic">${icoOf(p)}</span>${esc(p.label)}</div>`).join('')}
 $('palList').innerHTML=h||`<div class="empty">${t('palEmpty')}</div>`}
function placeAt(id,x,y){if(layout.items.some(i=>i.id===id))return;layout.items.push({id,x:Math.min(.98,Math.max(.02,x)),y:Math.min(.98,Math.max(.02,y))});saveLayout();_lastSig='';poll()}
function unplace(id){layout.items=layout.items.filter(i=>i.id!==id);saveLayout();_lastSig='';poll()}
const cv=$('planCanvas');
cv.addEventListener('dragover',e=>{if(editMode)e.preventDefault()});
cv.addEventListener('drop',e=>{if(!editMode)return;e.preventDefault();const id=e.dataTransfer.getData('text/plain');const r=cv.getBoundingClientRect();placeAt(id,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)});
cv.addEventListener('pointerdown',e=>{if(!editMode)return;const m=e.target.closest?e.target.closest('.mk'):null;if(!m||e.target.closest('.mkx'))return;
 const it=layout.items.find(i=>i.id===m.dataset.id);if(!it)return;dragging={it,m};cv.setPointerCapture(e.pointerId);e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(!dragging)return;const r=cv.getBoundingClientRect();
 dragging.it.x=Math.min(.98,Math.max(.02,(e.clientX-r.left)/r.width));dragging.it.y=Math.min(.98,Math.max(.02,(e.clientY-r.top)/r.height));
 dragging.m.style.left=dragging.it.x*100+'%';dragging.m.style.top=dragging.it.y*100+'%'});
cv.addEventListener('pointerup',e=>{if(dragging){dragging=null;saveLayout();_lastSig=''}});
cv.addEventListener('dblclick',e=>{if(!editMode)return;const m=e.target.closest('.mk');if(!m)return;const it=layout.items.find(i=>i.id===m.dataset.id);if(!it)return;
 const cur=m.querySelector('.mklabel').textContent;const nn=prompt(t('rename'),cur);if(nn!==null){it.label=nn.trim()||undefined;saveLayout();_lastSig='';poll()}});
/* ================= settings, updates ================= */
function openSettings(){drawSettings();$('dlg').showModal()}
function drawSettings(){const s=window.__s||{};
 $('dlgBody').innerHTML=`<div class="r"><h2 style="margin:0;flex:1">${ic('cog')}${t('settings')}</h2><button class="ghost" onclick="$('dlg').close()">${ic('close')}${t('close')}</button></div>
 <div class="sec"><h4>${t('about')}</h4><div>${t('version')}: <b>${esc(s.version||'?')}</b></div>
  <div class="r"><button class="primary" id="btnUpd" onclick="checkUpd()">${ic('update')}${t('checkUpd')}</button></div><div id="updRes"></div></div>
 <div class="sec"><h4>${t('ifaceH')}</h4><div>${t('ifaceInfo')} <b>${esc(s.iface||'')}</b></div><div class="hint">${t('ifaceHelp')}</div>
  <div class="r"><input type="text" id="lineIn" size="6" value="${esc(s.line||'1.1')}"><button onclick="saveLine()">${ic('restart')}${t('saveRestart')}</button></div><div id="lineMsg" class="hint"></div></div>`}
async function checkUpd(){const out=$('updRes');out.innerHTML=t('checking');
 try{const r=await fetch('/api/update/check');if(!r.ok)throw new Error(await r.text());const u=await r.json();
  if(!u.newer){out.innerHTML=`<span class="ok">${ic('check')}${t('upToDate')}</span> (${esc(u.latest||u.current)})`;return}
  out.innerHTML=`<div><b>${t('newVer')} ${esc(u.latest)}</b></div><div class="hint">${t('notesH')}</div><div class="notes">${esc(u.notes||'–')}</div>
   <div class="r">${u.canInstall?`<button class="primary" onclick="installUpd('${encodeURIComponent(u.asset)}')">${ic('download')}${t('install')}</button>`:`<span class="hint">${t('manualOnly')}</span>`}
   <a class="lnk" href="${esc(u.page)}" target="_blank" rel="noopener">${ic('open')}${t('openPage')}</a></div><div id="updProg"></div>`}
 catch(e){out.innerHTML=`<span class="bad">${t('checkFail')} ${esc(e.message)}</span>`}}
async function installUpd(a){const box=$('updProg');box.innerHTML=t('downloading');
 const r=await fetch('/api/update/install?asset='+a,{method:'POST'});if(!r.ok){box.innerHTML=`<span class="bad">${esc(await r.text())}</span>`;return}
 const iv=setInterval(async()=>{try{const s=await (await fetch('/api/update/status')).json();
  if(s.state==='downloading')box.innerHTML=`${t('downloading')} ${s.total?Math.round(s.bytes*100/s.total)+' %':''}<div class="progress"><i style="width:${s.total?s.bytes*100/s.total:5}%"></i></div>`;
  else if(s.state==='installing')box.innerHTML=t('installing');
  else if(s.state==='error'){clearInterval(iv);box.innerHTML=`<span class="bad">${esc(s.error)}</span>`}}catch(e){box.innerHTML=t('installing')}},500)}
async function saveLine(){const v=$('lineIn').value.trim(),m=$('lineMsg');
 if(!/^\d{1,2}\.\d{1,2}$/.test(v)){m.innerHTML=`<span class="bad">${t('badLine')}</span>`;return}
 let r=await fetch('/api/settings?line='+encodeURIComponent(v),{method:'POST'});if(!r.ok){m.innerHTML=`<span class="bad">${esc(await r.text())}</span>`;return}
 r=await fetch('/api/restart',{method:'POST'});if(!r.ok){m.innerHTML=t('restartManual');return}
 m.innerHTML=t('restarting');let down=false;const t0=Date.now();
 const iv=setInterval(async()=>{try{await fetch('/api/state',{cache:'no-store'});if(down||Date.now()-t0>9000){clearInterval(iv);location.reload()}}catch(e){down=true}},600)}
let sliderDown=false;
document.addEventListener('pointerdown',e=>{if(e.target&&e.target.type==='range')sliderDown=true},true);
document.addEventListener('pointerup',()=>{setTimeout(()=>{sliderDown=false},350)},true);
document.addEventListener('pointercancel',()=>{sliderDown=false},true);
let _lastSig='';
async function addDevice(){$('addErr').textContent='';const r=await fetch(`/api/add?product=${encodeURIComponent($('addProd').value)}&name=${encodeURIComponent($('addName').value.trim())}`,{method:'POST'});if(r.ok){$('addName').value='';_lastSig='';poll()}else $('addErr').textContent=await r.text()}
async function rmDev(n){if(!confirm(t('confirmRm')))return;await fetch(`/api/remove?dev=${n}`,{method:'POST'});_lastSig='';poll()}
let prods=[];
async function fillProducts(){if(!prods.length)try{prods=await (await fetch('/api/products')).json()}catch(e){return}
 const cur=$('addProd').value;$('addProd').innerHTML=prods.map(p=>`<option value="${p.key}">${esc(lang==='da'?p.da:p.en)}</option>`).join('');if(cur)$('addProd').value=cur}
function clearLog(){lines=[];drawLog()}
function colorize(s){return esc(s).replace(/\b(\d{1,2}\.\d{1,2}\.\d{1,3})\b/g,'<span class="ia">$1</span>').replace(/\b(\d{1,2}\/\d{1,2}\/\d{1,3})\b/g,'<span class="gad">$1</span>').replace(/\b(GroupValue(?:Write|Read|Response)|A_[A-Za-z_]+(?:\.[a-z]+)?)/g,'<span class="svc">$1</span>')}
function drawLog(){const f=$('filter').value.toLowerCase(),b=$('showBus').checked,e=$('showExp').checked,box=$('log');
 const stick=box.scrollTop+box.clientHeight>=box.scrollHeight-30;
 box.innerHTML=lines.filter(l=>(l.cat==='bus'?b:e)&&(!f||(l.dev+' '+l.text).toLowerCase().includes(f))).map(l=>
  `<div class="ln ${l.cat==='bus'?'bus':'exp'}"><span class="t">${l.t}</span><span class="tag">${l.cat==='bus'?'bus':esc(l.dev)+' · '+esc(l.cat)}</span><span class="${l.cat==='bus'?'':'x'}">${l.cat==='bus'?colorize(l.text):esc(l.text)}</span></div>`).join('');
 if(stick)box.scrollTop=box.scrollHeight}
async function poll(){try{const s=await (await fetch('/api/state')).json();const sig=JSON.stringify(s)+lang+busCount+sel;
  if(sig!==_lastSig&&!dragging&&!document.querySelector('.key.down')&&!sliderDown){_lastSig=sig;render(s)}
  const l=await (await fetch('/api/log?since='+since)).json(); if(l.entries.length){for(const x of l.entries){lines.push(x);since=x.seq;if(x.cat==='bus')busCount++} if(lines.length>2000)lines=lines.slice(-1500); drawLog()}}catch(e){}}
for(const id of ['filter','showBus','showExp'])$(id).addEventListener('input',drawLog);
loadLayout();applyStatic();poll();setInterval(poll,600);
</script>
