<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vKNX</title>
<script>
// Theme and size before first paint. Light (bright, high contrast, good on projectors) is the default; an explicit choice is respected.
try { var th = localStorage.getItem('vknx-theme'); document.documentElement.dataset.theme = th === 'dark' || th === 'paper' ? th : 'light'; if (localStorage.getItem('vknx-size') === 'large') document.documentElement.dataset.size = 'large'; } catch (e) {}
</script>
<link rel="stylesheet" href="/web/css/app.css">
</head>
<body>
<div id="app"></div>
<noscript>vKNX needs JavaScript.</noscript>
<script type="module" src="/web/js/main.js"></script>
</body>
</html>
